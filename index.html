            <section class="section-form">
                <form id="form" class="form">
                    <!-- Campo Descrição -->
                    <div class="input-group">
                        <label for="description" class="sr-only">Descrição</label>
                        <input id="description" class="input" type="text" placeholder="Descrição">
                    </div>

                    <!-- Campo Valor -->
                    <div class="input-group">
                        <label for="value" class="sr-only">Valor</label>
                        <input id="value" class="input" type="number" placeholder="Valor">
                    </div>

                    <!-- Select Tipo de Movimentação -->
                    <div class="input-group">
                        <label for="movement-type" class="sr-only">Tipo de Movimentação</label>
                        <select name="movement-type" id="movement-type" class="select select-movement">
                            <option value="">Selecione</option>
                            <option value="entry">Entrada</option>
                            <option value="output">Saída</option>
                        </select>
                    </div>

                    <!-- Select Categoria -->
                    <div class="input-group">
                        <label for="select-category" class="sr-only">Categoria</label>
                        <select name="category" id="select-category" class="select select-category">
                            <option value="">Selecione</option>
                            <option value="salary">Salário</option>
                            <option value="food">Alimentação</option>
                            <option value="transport">Transporte</option>
                            <option value="leisure">Lazer</option>
                            <option value="travels">Viagens</option>
                            <option value="others">Outros</option>
                        </select>
                    </div>

                    <button id="btn-add" class="btn-add" type="submit">
                        <i class="fa-solid fa-plus btn-icon"></i>
                        <span id="btn-text">Adicionar</span>
                    </button>
                </form>
            </section>

            <section class="section-list">
                <h2>Movimentações</h2>
                <ul id="list-movement" class="list-movement">
                </ul>
            </section>

        </main>
        <script src="index.js"></script>
    </body>
